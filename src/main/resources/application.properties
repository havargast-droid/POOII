spring.application.name=ProyectoVehiculos

server.port = 9001

# Configurar la conexion a la base de datos
spring.datasource.url = jdbc:mysql://localhost:3306/proyecto_vehiculos
spring.datasource.username = root
spring.datasource.password = Vehiculos2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Indica si debe mostrar el log de las consultas sql ejecutadas
# Bueno a la hora de depurar
spring.jpa.show-sql= true

# Configurar Hibernate
spring.jpa.hibernate.ddl-auto= update
spring.data.jpa.repositories.enabled=true

# Subida de archivos (Excel del cargue masivo)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger / OpenAPI (Laboratorio 4)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.pathsToMatch=/authenticate,/vehiculo/**,/documento/**,/persona/**,/usuario/**,/vehiculo-persona/**,/vehiculo-documento/**,/trayecto/**,/persona-cargue/**,/public/**
